[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quiz-estudio"
version = "0.1.0"
description = "Aplicacion Flask para estudiar con preguntas tipo quiz."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quiz_estudio = [
    "templates/*.html",
    "static/*.css",
]
