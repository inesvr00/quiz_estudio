{% extends "base.html" %}

{% block content %}
<header class="topbar">
    <h1>Preguntas</h1>
    <a href="{{ url_for('quiz.reiniciar') }}">Cambiar temas</a>
</header>

<form method="post">
    {% for q in questions %}
        <section class="question-card">
            <p class="topic">{{ q.tema }}</p>
            <h2>{{ loop.index }}. {{ q.enunciado }}</h2>

            {% for i in range(1, 5) %}
                <label class="option">
                    <input type="radio" name="pregunta_{{ q.csv_id }}" value="{{ i }}">
                    <span>{{ i }}. {{ q["opcion_" ~ i] }}</span>
                </label>
            {% endfor %}
        </section>
    {% endfor %}

    <button type="submit" class="finish-button">Terminar y corregir</button>
</form>
{% endblock %}
