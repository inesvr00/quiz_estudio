{% extends "base.html" %}

{% block content %}
<header class="topbar">
    <h1>Preguntas</h1>
    <a href="{{ url_for('quiz.reiniciar') }}">Cambiar temas</a>
</header>

{% if notice %}
    <p class="warning">{{ notice }}</p>
{% endif %}

<form method="post">
    {% for q in questions %}
        <section class="question-card">
            <p class="topic">{{ q.tema }}</p>
            <h2>{{ loop.index }}. {{ q.enunciado }}</h2>

            {% for option in q.display_options %}
                <label class="option">
                    <input type="radio" name="pregunta_{{ q.question_id }}" value="{{ option.option_id }}">
                    <span>{{ loop.index }}. {{ option.text }}</span>
                </label>
            {% endfor %}
        </section>
    {% endfor %}

    <button type="submit" class="finish-button">Terminar y corregir</button>
</form>
{% endblock %}
